[package]
name = "bridge"
version = "0.1.0"
description = "RSGP bridge — mint/burn authority for the on-chain RuneScape economy"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bridge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = []
profile = ["anchor-v2-testing/profile"]

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }
anchor-spl = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next", features = ["metadata"] }
solana-program-log = { version = "1.1", features = ["macro"] }
wincode = { version = "0.5", features = ["derive"] }

[dev-dependencies]
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }
solana-pubkey = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
